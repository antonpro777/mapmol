<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101820"><title>MapMol — Молодечно</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body,#map{height:100%;width:100%;margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#101820;overflow:hidden}
#map{position:absolute;inset:0;background:#182633}.leaflet-control-attribution{font-size:9px!important;background:#101820b8!important;color:#c8d2dc!important}.leaflet-control-attribution a{color:#8fc7ff!important}
.stats-button{position:absolute;z-index:1000;right:18px;bottom:24px;border:0;border-radius:16px;padding:14px 19px;background:#fff;color:#17212b;font-size:14px;font-weight:750;box-shadow:0 6px 24px #0005;cursor:pointer}
.stats-panel{position:absolute;z-index:999;left:14px;right:14px;bottom:84px;max-width:440px;margin:auto;padding:18px;border-radius:20px;background:#111d29f2;color:#f4f7fb;box-shadow:0 12px 40px #0007;backdrop-filter:blur(18px);display:none}
.stats-panel.open{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.panel-head strong{font-size:17px}.gps{font-size:11px;color:#9eb1c4}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px;border-radius:13px;background:#ffffff0b}.stat b{display:block;font-size:23px;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.stat small{display:block;margin-top:4px;color:#9eb1c4;font-size:11px}.brand{position:absolute;z-index:900;left:16px;top:16px;padding:9px 12px;border-radius:12px;background:#111d29d9;color:#fff;font-size:13px;font-weight:850;letter-spacing:.4px;pointer-events:none}.brand span{color:#68b6ff}
@media(min-width:700px){.stats-button{right:28px;bottom:28px}.stats-panel{left:auto;right:28px;bottom:88px}.brand{left:24px;top:24px}}
</style></head>
<body>
<div id="map"></div><div class="brand">MAP<span>MOL</span></div>
<section class="stats-panel" id="statsPanel">
 <div class="panel-head"><strong>Моя статистика</strong><span class="gps" id="gpsStatus">Подключение GPS…</span></div>
 <div class="stats-grid">
  <div class="stat"><b id="steps">0</b><small>Шагов · примерно</small></div>
  <div class="stat"><b id="distance">0 м</b><small>Пройдено</small></div>
  <div class="stat"><b id="elapsed">00:00</b><small>Время исследования</small></div>
  <div class="stat"><b id="percent">0</b><small>Открытых точек</small></div>
 </div>
</section>
<button class="stats-button" id="statsButton" aria-expanded="false">Статистика</button>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false,preferCanvas:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false}).setView([54.3105,26.845],14);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics'}).addTo(map);
L.control.zoom({position:'bottomleft'}).addTo(map);
const R=12,KEY='mapmol-explored-v4';let points=[],seconds=0,totalMeters=0,segmentStarts=[];
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'&&!Array.isArray(s)){points=Array.isArray(s.points)?s.points:[];seconds=Number(s.seconds)||0;totalMeters=Number(s.totalMeters)||0;segmentStarts=Array.isArray(s.segmentStarts)?s.segmentStarts:[]}else{const old=JSON.parse(localStorage.getItem('mapmol-explored-v1')||'[]');if(Array.isArray(old))points=old}}catch(e){}segmentStarts.push(points.length);
let watch=null,last=null,lastTime=null,userMarker=null,accuracyCircle=null,startedAt=Date.now()-seconds*1000;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify({points,segmentStarts,seconds,totalMeters,savedAt:Date.now()}))}catch(e){}}
const MaskLayer=L.Layer.extend({
 onAdd:function(m){
  this._map=m;
  this._pane=m.createPane('explorationMaskPane');
  this._pane.style.zIndex='250';
  this._pane.style.pointerEvents='none';
  this._canvas=L.DomUtil.create('canvas','exploration-mask',this._pane);
  this._canvas.style.position='absolute';
  this._canvas.style.pointerEvents='none';
  m.on('move zoom resize viewreset zoomend moveend',this.draw,this);
  this.draw();
 },
 onRemove:function(m){
  if(this._pane)m.getPanes().mapPane.removeChild(this._pane);
  m.off('move zoom resize viewreset zoomend moveend',this.draw,this);
 },
 draw:function(){
  if(!this._map)return;
  const m=this._map,s=m.getSize(),c=this._canvas,d=window.devicePixelRatio||1;
  c.width=Math.round(s.x*d);c.height=Math.round(s.y*d);
  c.style.width=s.x+'px';c.style.height=s.y+'px';
  const origin=m.containerPointToLayerPoint([0,0]);
  L.DomUtil.setPosition(c,origin);
  const x=c.getContext('2d');
  x.setTransform(d,0,0,d,0,0);
  x.clearRect(0,0,s.x,s.y);
  x.globalCompositeOperation='source-over';
  x.fillStyle='rgba(3,24,82,.82)';
  x.fillRect(0,0,s.x,s.y);
  x.globalCompositeOperation='destination-out';
  const projected=points.map(p=>{
   const q=m.latLngToLayerPoint([p.lat,p.lng]);
   const edge=m.latLngToLayerPoint([p.lat+R/111320,p.lng]);
   return {x:q.x-origin.x,y:q.y-origin.y,r:Math.max(1,Math.abs(edge.y-q.y))};
  });
  if(projected.length>1){
   for(let i=1;i<projected.length;i++){
    if(segmentStarts.includes(i))continue;
    const a=projected[i-1],b=projected[i],r=(a.r+b.r)/2;
    x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);
    x.lineWidth=r*2;x.lineCap='round';x.lineJoin='round';x.stroke();
   }
  }
  for(const p of projected){
   x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fill();
  }
  x.globalCompositeOperation='source-over';
 }
});
const mask=new MaskLayer().addTo(map);
function update(){ $('steps').textContent=Math.round(totalMeters/.75).toLocaleString('ru-RU');$('distance').textContent=totalMeters>=1000?(totalMeters/1000).toFixed(2)+' км':Math.round(totalMeters)+' м';$('elapsed').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');$('percent').textContent=points.length.toLocaleString('ru-RU');save()}
function reveal(lat,lng){const next=L.latLng(lat,lng);if(!points.length||map.distance([points[points.length-1].lat,points[points.length-1].lng],next)>=2){points.push({lat,lng});mask.draw();update()}}
function updateUserMarkerSize(){if(userMarker)userMarker.setStyle({radius:Math.max(2,Math.min(7,map.getZoom()-9)),weight:2})}map.on('zoomend',updateUserMarkerSize);
function position(pos){
 const lat=pos.coords.latitude,lng=pos.coords.longitude,acc=Number(pos.coords.accuracy)||999,ll=L.latLng(lat,lng),now=pos.timestamp||Date.now();
 if(acc>25){$('gpsStatus').textContent='GPS уточняет положение';return}
 if(last){
  const d=map.distance(last,ll),elapsed=Math.max(.5,(now-(lastTime||now-1000))/1000);
  if(d>Math.max(35,elapsed*9)){ $('gpsStatus').textContent='GPS отфильтровал скачок';return }
  if(d<1.5){$('gpsStatus').textContent='GPS активен';return}
  totalMeters+=d;
 }
 last=ll;lastTime=now;
 $('gpsStatus').textContent='GPS активен';
 if(!userMarker){userMarker=L.circleMarker(ll,{radius:5,color:'#fff',weight:2,fillColor:'#1688ff',fillOpacity:1}).addTo(map);map.setView(ll,16);updateUserMarkerSize()}else userMarker.setLatLng(ll);
 if(accuracyCircle)map.removeLayer(accuracyCircle);
 accuracyCircle=L.circle(ll,{radius:Math.min(acc,25),color:'#8dc8ff',weight:1,fillOpacity:.04,interactive:false}).addTo(map);
 reveal(lat,lng);update()
}
function gpsError(e){$('gpsStatus').textContent='GPS недоступен';console.warn('Geolocation:',e.message)}
if(navigator.geolocation){watch=navigator.geolocation.watchPosition(position,gpsError,{enableHighAccuracy:true,maximumAge:0,timeout:20000})}else $('gpsStatus').textContent='Нет поддержки GPS';
setInterval(()=>{if(watch!==null){seconds=Math.floor((Date.now()-startedAt)/1000);update()}},1000);
$('statsButton').onclick=()=>{const open=$('statsPanel').classList.toggle('open');$('statsButton').setAttribute('aria-expanded',String(open));$('statsButton').textContent=open?'Скрыть':'Статистика'};
update();
</script></body></html>
